# A web app's manifests
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: &labels
    app: web
    tier: frontend
spec:
  replicas: 3
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      containers:
        - name: web
          image: registry.example.com/web:1.4.2
          ports:
            - containerPort: 8080
          env:
            - name: LOG_LEVEL
              value: info
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: web-secrets, key: database-url}
          resources:
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Secret
metadata:
  name: web-secrets
type: Opaque
data:
  database-url: Y3gs-vHx2ff9EuDSh6SgfUBOLxyKY2V2gmwn0LNsSiaynAV-
  session-key: AMI11k3VWvXRZ-XO5bXZHXYh04NVKlKwPjIrDe9-MBHi
